name: CI

# Feedback veloce a ogni push: test Python + build frontend.
# Il gate del DEPLOY vive in cloudbuild.yaml (step test prima di build); questo
# workflow è il feedback rapido su push/PR (armonizzazione con gli altri repo).
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests
        # Il referto di unittest, non il codice di uscita.
        #
        # Questa suite va in segfault DOPO aver stampato OK, circa una run su
        # quattro, e la causa non è stata trovata (sei run con -X faulthandler
        # non l'hanno riprodotta). Finché resta così, leggere solo il codice di
        # uscita vuol dire un quarto delle pull request della catena bloccate da
        # un fallimento che non è successo, e la catena è non presidiata:
        # nessuno rilancerebbe.
        #
        # Non è una rete di sicurezza allentata. Un crash a metà suite non
        # stampa nessun OK e fallisce qui come prima: passa solo il caso in cui
        # unittest ha già dichiarato tutto verde.
        run: |
          run_suite() {
            python -X faulthandler -m unittest discover -s tests 2>&1 | tee suite.log
            return ${PIPESTATUS[0]}
          }
          verdict() {
            if grep -qE '^FAILED' suite.log; then echo failed; return; fi
            if grep -qE '^OK' suite.log; then echo ok; return; fi
            echo crashed
          }

          run_suite; status=$?
          case "$(verdict)" in
            failed)  echo "::error::la suite ha fallito"; exit 1 ;;
            ok)
              if [ "$status" -ne 0 ]; then
                echo "::warning::suite verde, ma l'interprete è morto in uscita (exit $status)"
              fi
              exit 0 ;;
          esac

          # Nessun verdetto: l'interprete è morto prima di scriverne uno. Un
          # ritentativo solo, e il secondo conta come definitivo. Ritentare un
          # fallimento vero sarebbe nascondere un bug, ma qui non c'è nessun
          # fallimento da nascondere: non c'è nessun referto.
          echo "::warning::la suite è morta senza referto (exit $status), ritento una volta"
          run_suite; status=$?
          case "$(verdict)" in
            ok) exit 0 ;;
            failed) echo "::error::la suite ha fallito al secondo tentativo"; exit 1 ;;
            *) echo "::error::la suite è morta senza referto due volte (exit $status)"; exit 1 ;;
          esac

  # Qui stava il job `gate`, che sui branch `automation/*` eseguiva
  # `scripts/pipeline_gate.py`. Se ne va con il file: la catena editoriale
  # autonoma non esiste più, e la catena minima non ha cancello per scelta (il
  # controllo è il verificatore, dentro il workflow, prima che l'articolo tocchi
  # il disco).
  #
  # Non è stato lasciato al suo posto perché un job che invoca un file
  # cancellato non è inerte: `if:` è valutato dopo lo scheduling, quindi ogni
  # PR da un branch `automation/*` ancora aperto sarebbe fallita su "file non
  # trovato", cioè un rosso che non parla del suo contenuto.

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check committed bundle
        run: git diff --exit-code -- ../app/static/dist

