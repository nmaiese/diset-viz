name: CI

# Feedback veloce a ogni push: test Python + build frontend.
# Il gate del DEPLOY vive in cloudbuild.yaml (step test prima di build); questo
# workflow è il feedback rapido su push/PR (armonizzazione con gli altri repo).
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests
        # Il referto di unittest, non il codice di uscita.
        #
        # Questa suite va in segfault DOPO aver stampato OK, circa una run su
        # quattro, e la causa non e' stata trovata (sei run con -X faulthandler
        # non l'hanno riprodotta). Finche' resta cosi', leggere solo il codice di
        # uscita vuol dire un quarto delle pull request della catena bloccate da
        # un fallimento che non e' successo, e la catena e' non presidiata:
        # nessuno rilancerebbe.
        #
        # Non e' una rete di sicurezza allentata. Un crash a meta' suite non
        # stampa nessun OK e fallisce qui come prima: passa solo il caso in cui
        # unittest ha gia' dichiarato tutto verde.
        run: |
          run_suite() {
            python -X faulthandler -m unittest discover -s tests 2>&1 | tee suite.log
            return ${PIPESTATUS[0]}
          }
          verdict() {
            if grep -qE '^FAILED' suite.log; then echo failed; return; fi
            if grep -qE '^OK' suite.log; then echo ok; return; fi
            echo crashed
          }

          run_suite; status=$?
          case "$(verdict)" in
            failed)  echo "::error::la suite ha fallito"; exit 1 ;;
            ok)
              if [ "$status" -ne 0 ]; then
                echo "::warning::suite verde, ma l'interprete e' morto in uscita (exit $status)"
              fi
              exit 0 ;;
          esac

          # Nessun verdetto: l'interprete e' morto prima di scriverne uno. Un
          # ritentativo solo, e il secondo conta come definitivo. Ritentare un
          # fallimento vero sarebbe nascondere un bug, ma qui non c'e' nessun
          # fallimento da nascondere: non c'e' nessun referto.
          echo "::warning::la suite e' morta senza referto (exit $status), ritento una volta"
          run_suite; status=$?
          case "$(verdict)" in
            ok) exit 0 ;;
            failed) echo "::error::la suite ha fallito al secondo tentativo"; exit 1 ;;
            *) echo "::error::la suite e' morta senza referto due volte (exit $status)"; exit 1 ;;
          esac

  # Il cancello della catena, fatto rispettare anche dal lato remoto. Finora
  # lo ri-eseguiva solo scripts/pipeline_merge.py prima di fondere, cioe' un
  # controllo agent-side su un master non protetto: un merge manuale o un push
  # diretto non lo incontrava mai. Qui diventa un check remoto come la suite,
  # quindi pipeline_merge --policy checks lo aspetta insieme al resto.
  #
  # Solo sui branch automation/*: fuori dalla catena non c'e' uno stadio da
  # giudicare. Lo stadio e' il primo segmento del nome del branch
  # (automation/<stadio>-<data>, docs/AGENT_CONTRACT.md). --skip-tests perche'
  # la suite intera gira gia' nel job qui sopra: rifarla qui raddoppierebbe il
  # tempo del check piu' lento senza aggiungere un verdetto.
  gate:
    if: startsWith(github.head_ref || github.ref_name, 'automation/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Il cancello misura il diff contro origin/master: serve la storia.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        # Il check del vintage importa l'app, e senza dipendenze il cancello
        # boccia apposta invece di saltare il controllo.
        run: pip install -r requirements.txt
      - name: Run the gate
        run: |
          ref="${{ github.head_ref || github.ref_name }}"
          stage="${ref#automation/}"
          stage="${stage%%-*}"
          echo "cancello per lo stadio: $stage"
          python scripts/pipeline_gate.py --stage "$stage" --skip-tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
