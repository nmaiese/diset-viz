# Build + deploy su Cloud Run a ogni push su master.
#
# Non impostare env var qui. SITE_URL, GOOGLE_TAG_MANAGER_ID,
# GA_MEASUREMENT_ID, ADSENSE_CLIENT e le altre variabili pubbliche vivono sul
# servizio Cloud Run e vengono preservate tra le revisioni. Per aggiornarne una
# sola usa `gcloud run services update` con --update-env-vars, non --set-env-vars.
steps:
  # GATE: i test devono passare PRIMA di build+deploy. Cloud Build esegue gli step
  # in sequenza e si ferma al primo exit non-zero: un test rosso blocca il deploy.
  - name: 'python:3.12-slim'
    id: test
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # git non e' nell'immagine slim, e da fine luglio la suite lo invoca
        # davvero: pipeline_log.build_entry legge HEAD e la base per popolare
        # il diario (commit, base_commit), non solo nei test dedicati ma in
        # ogni test che passa da build_entry. Senza, qui falliva con
        # FileNotFoundError prima ancora di arrivare a build+deploy, e il
        # fallimento non si vedeva mai in CI perche' i runner di GitHub
        # Actions hanno git di serie.
        apt-get update -qq && apt-get install -y -qq --no-install-recommends git
        pip install --quiet -r requirements.txt
        python -m unittest discover -s tests

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/diset-viz:latest'
      - '-t'
      - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/diset-viz:${SHORT_SHA}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/diset-viz'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'diset-viz'
      - '--image=europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/diset-viz:${SHORT_SHA}'
      - '--region=europe-west1'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--memory=1Gi'

images:
  - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/diset-viz:latest'
  - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/diset-viz:${SHORT_SHA}'

options:
  logging: CLOUD_LOGGING_ONLY
