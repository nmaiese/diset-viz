# Alembic possiede lo schema Postgres del backend mutabile (Supabase). Gira solo
# in cloudbuild (step `alembic upgrade head`, con DIRECT_URL sulla porta 5432) e
# in locale contro un Postgres usa-e-getta. Su SQLite (test/CI) lo schema lo crea
# app/db.py con create_all: qui non serve.
#
# L'URL non e' cablata qui: env.py la legge da app/config.py (DIRECT_URL).
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
