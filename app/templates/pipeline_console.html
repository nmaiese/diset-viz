<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Console catena · {{ site_name }}</title>
    {# Pagina admin interna: niente GTM/analytics/CMP (il banner privacy qui è
       rumore). Le identità Supabase servono comunque, iniettate diritte. #}
    <script>
      window.__supabase = {url: {{ SUPABASE_URL | tojson }}, anonKey: {{ SUPABASE_ANON_KEY | tojson }}};
      window.__monitorAdminEmail = {{ monitor_admin_email | tojson }};
    </script>
    <style>
      :root { --navy:#15233b; --paper:#fbfaf7; --accent:#e4572e; --line:#d9d6cf; --ink:#15233b; --ink-soft:#5b6472; }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--paper); color:var(--ink); font-family: Inter, system-ui, sans-serif; }
      #monitor-root { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
      h1 { font-family: Archivo, sans-serif; font-size: 26px; margin: 0; }
      h2 { font-family: Archivo, sans-serif; font-size: 16px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); margin: 28px 0 10px; }
      .mon-gate { text-align:center; padding: 80px 16px; }
      .mon-msg, .mon-empty { color: var(--ink-soft); }
      .mon-btn { background: var(--accent); color:#fff; border:0; border-radius:999px; padding:10px 22px; font-size:14px; font-weight:600; cursor:pointer; margin-top:14px; }
      .mon-btn--ghost { background:none; color:var(--ink); border:1px solid var(--line); }
      .mon-head { display:flex; align-items:center; gap:12px; }
      .mon-head h1 { flex: 0 0 auto; }
      .mon-dot { width:9px; height:9px; border-radius:50%; background:#2e9e4f; box-shadow:0 0 0 0 rgba(46,158,79,.5); animation: pulse 2s infinite; }
      @keyframes pulse { 70%{ box-shadow:0 0 0 8px rgba(46,158,79,0);} 100%{ box-shadow:0 0 0 0 rgba(46,158,79,0);} }
      .mon-head .mon-btn { margin: 0 0 0 auto; }
      .mon-table { overflow-x: auto; }
      table { width:100%; border-collapse: collapse; font-size: 13.5px; font-family: "Space Mono", ui-monospace, monospace; }
      th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); white-space: nowrap; }
      th { color: var(--ink-soft); font-weight:700; }
      {# Su desktop le celle a testo lungo (nome indicatore, descrizione del
         prossimo passo) restano in nowrap e gonfiano la tabella oltre la pagina.
         Nelle tabelle .mon-cards le si lascia andare a capo e si tiene il testo
         monospace fuori dalle celle lunghe, così la tabella sta nella colonna. #}
      table.mon-cards th, table.mon-cards td { white-space: normal; overflow-wrap: anywhere; vertical-align: top; }
      table.mon-cards td.mon-mini { white-space: nowrap; overflow-wrap: normal; }
      table.mon-cards td, table.mon-cards td small { font-family: Inter, system-ui, sans-serif; }
      td small { color: var(--ink-soft); font-size: 11px; }
      td a { color: var(--accent); text-decoration: none; }
      td a:hover { text-decoration: underline; }
      .mon-head2 { display:flex; align-items:center; gap:12px; }
      .mon-head2 h2 { margin: 28px 0 10px; }
      .mon-head2 .mon-btn { margin-left:auto; }
      .mon-btn--sm { padding:5px 14px; font-size:12px; }
      .mon-filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
      .mon-filters input, .mon-filters select { font-family: Inter, system-ui, sans-serif; font-size:13px; padding:6px 9px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); }
      .mon-filters input[type=search] { flex:1 1 220px; min-width:180px; }
      .mon-date { display:inline-flex; align-items:center; gap:5px; color:var(--ink-soft); font-size:12px; }
      .mon-totals { margin-bottom:10px; }
      .mon-coverage { margin-bottom:14px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; }
      .mon-coverage:empty { display:none; }
      {# I chip di copertura portano testo più lungo e più variabile (fino a due
         motivi di esclusione) dei chip di stato: qui il nowrap generico dei chip
         si toglie, così un elenco lungo va a capo dentro il chip invece di
         spingere la riga oltre la sezione. #}
      .mon-coverage .mon-chip { white-space: normal; overflow-wrap: anywhere; }
      .mon-totals-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
      .mon-chip { font-family: "Space Mono", ui-monospace, monospace; font-size:11.5px; background:#eee9e0; color:var(--ink); border:1px solid transparent; border-radius:999px; padding:3px 10px; white-space:nowrap; }
      .mon-chip--strong { background:var(--navy); color:var(--paper); font-weight:700; }
      .mon-chip--click { cursor:pointer; }
      .mon-chip--click:hover { border-color:var(--ink-soft); }
      .mon-chip--active { background:var(--accent); color:var(--paper); border-color:var(--accent); }
      .mon-mini { font-size:14px; letter-spacing:2px; }
      .mon-legend { margin-bottom:12px; font-size:13px; }
      .mon-legend > summary { cursor:pointer; color:var(--ink-soft); font-family: "Space Mono", ui-monospace, monospace; font-size:12px; padding:4px 0; }
      .mon-legend-row { display:flex; gap:10px; align-items:baseline; padding:4px 0; line-height:1.35; }
      .mon-legend-row > span:first-child { flex:0 0 auto; }
      .mon-pager { display:flex; align-items:center; gap:12px; justify-content:center; padding:8px 0; }
      .mon-pager .mon-btn[disabled] { opacity:.4; cursor:default; }
      .mon-pager-info { font-family: "Space Mono", ui-monospace, monospace; font-size:12px; color:var(--ink-soft); }
      {# Solo l'identità cartografica: navy, carta, unico accento #e4572e. Gli
         stati si distinguono per peso, riempimento, bordo (pieno/tratteggiato) e
         opacità, non per colori nuovi. Accento pieno = ciò che si lavora ora;
         navy pieno = fatto; contorno accento = quasi fatto; neutro = in coda. #}
      .mon-status { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:2px 8px; border-radius:4px; border:1px solid var(--line); background:var(--paper); color:var(--ink-soft); white-space:nowrap; }
      .mon-status--da-correggere { background:var(--accent); color:var(--paper); border-color:var(--accent); }
      .mon-status--in-attesa { background:var(--paper); color:var(--ink); border-color:var(--ink-soft); border-style:dashed; }
      .mon-status--in-quarantena { background:var(--paper); color:var(--ink-soft); border-color:var(--ink-soft); border-style:dashed; opacity:.7; }
      .mon-status--in-lavorazione { background:var(--paper); color:var(--accent); border-color:var(--accent); }
      .mon-status--pubblicata { background:var(--navy); color:var(--paper); border-color:var(--navy); }
      .mon-status--proposta { background:var(--paper); color:var(--ink-soft); border-color:var(--ink-soft); border-style:dotted; }
      .mon-status--in-coda { background:var(--paper); color:var(--ink-soft); border-color:var(--line); }
      .mon-status--chiusa { background:var(--paper); color:var(--ink-soft); border-color:var(--line); opacity:.55; }
      {# Mobile: le tabelle .mon-cards diventano schede impilate, una riga per
         etichetta (dal data-label di ogni cella), invece di uno scroll orizzontale
         illeggibile. Solo sotto i 640px; sopra restano tabelle. #}
      @media (max-width: 640px) {
        #monitor-root { padding: 20px 12px 48px; }
        .mon-filters input[type=search] { flex-basis:100%; }
        table.mon-cards, table.mon-cards tbody, table.mon-cards tr, table.mon-cards td { display:block; width:100%; }
        table.mon-cards thead { position:absolute; left:-9999px; }
        table.mon-cards { border:0; }
        table.mon-cards tr { border:1px solid var(--line); border-radius:8px; margin-bottom:10px; padding:4px 2px; background:#fff; }
        {# Cella a blocco, non flex: l'etichetta sta sopra e il valore sotto, così
           i <br> e i <small> di Indicatore e Prossimo passo restano su più righe
           invece di accalcarsi in fila. #}
        table.mon-cards td { border:0; border-bottom:1px solid var(--line); white-space:normal; display:block; padding:6px 10px; }
        table.mon-cards tr td:last-child { border-bottom:0; }
        table.mon-cards td:empty { display:none; }
        table.mon-cards td::before { content: attr(data-label); display:block; color:var(--ink-soft); font-weight:700; text-transform:uppercase; font-size:10px; letter-spacing:.03em; margin-bottom:2px; }
      }
    </style>
  </head>
  <body>
    <div id="monitor-root"><p class="mon-msg">Carico...</p></div>
    <script type="module" crossorigin src="{{ asset_url('dist/assets/monitor.js') }}"></script>
  </body>
</html>
