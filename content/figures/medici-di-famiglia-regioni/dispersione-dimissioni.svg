<title id="fig-dispersione-dimissioni-t">Dove più medici superano il tetto, la quota di dimissioni fuori regione tende a essere più bassa</title>
<desc id="fig-dispersione-dimissioni-d">Abruzzo: 30,5 e 16,3; Basilicata: 29,3 e 29,7; Calabria: 37,2 e 21,8; Campania: 58,8 e 9,8; Emilia-Romagna: 57,6 e 5,7; Friuli-Venezia Giulia: 52,4 e 7,7; Lazio: 48,7 e 7,4; Liguria: 50,7 e 15,3; Lombardia: 74,0 e 5,1; Marche: 55,5 e 13,4; Molise: 21,6 e 32,6; Piemonte: 54,1 e 6,7; Puglia: 35,0 e 9,2; Sardegna: 60,6 e 7,1; Sicilia: 25,5 e 7,0; Toscana: 49,4 e 6,8; Trentino Alto Adige: 60,3 e 9,8; Umbria: 34,8 e 14,0; Valle d&#x27;Aosta: 61,1 e 18,6; Veneto: 68,7 e 6,4</desc>
<text class="fig__title" x="0" y="20"><tspan x="0" dy="0">Dove più medici superano il tetto, la quota di</tspan><tspan x="0" dy="24">dimissioni fuori regione tende a essere più bassa</tspan></text>
<text class="fig__subtitle" x="0" y="68"><tspan x="0" dy="0">2023, percentuali. Tendenza moderata: Spearman -0,50 su 20</tspan><tspan x="0" dy="18">regioni, -0,32 senza Lombardia e Molise.</tspan></text>
