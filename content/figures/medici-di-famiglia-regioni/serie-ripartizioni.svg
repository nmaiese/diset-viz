<title id="fig-serie-t">Fra Nord e Mezzogiorno la distanza passa da 2 punti nel 2004 a 24 nel 2023</title>
<desc id="fig-serie-d">Quota di medici di famiglia con più di 1500 assistiti, per ripartizione, dal 2004 al 2023. Nord da 17,6 a 63,8, Centro da 12,5 a 48,7, Mezzogiorno da 15,6 a 39,6. Nel 2004 il Nord stava a 2,0 punti dal Mezzogiorno, nel 2023 a 24,2.</desc>
