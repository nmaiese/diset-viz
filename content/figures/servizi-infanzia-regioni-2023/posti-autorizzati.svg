<svg class="fig" viewBox="0 0 720 520" role="img" aria-labelledby="fig-t fig-d" xmlns="http://www.w3.org/2000/svg">
<title id="fig-t">Nei capoluoghi l'offerta è spesso maggiore, ma resta il divario Nord-Sud</title>
<desc id="fig-d">Grafico a barre: posti nei nidi ogni 100 bambini. Centro: 49,9 capoluoghi, 33,4 altri. Nord-est: 47,3 e 36,1. Nord-ovest: 44,8 e 33,5. Italia: 39,8 e 28,2. Isole: 20,7 e 19,0. Sud: 23,0 e 17,9.</desc>
